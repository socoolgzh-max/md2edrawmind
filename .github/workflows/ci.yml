name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parser & docx unit tests
        run: python tests/test_parser.py

      - name: README links & anchors
        run: python tools/check_readme_links.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: MathJax smoke test (TeX -> SVG)
        run: node -e "const{renderTex}=require('./tools/mathjax.js');const r=renderTex('\\sum_{n=1}^\\infty \\frac{1}{n^p}');if(!r.svg){throw new Error('render failed')}console.log('svg ok, width',r.widthEx,'ex')"
