[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2edrawmind"
version = "1.0.0"
description = "Turn Markdown notes with LaTeX formulas into Word files that EdrawMind can import with formulas intact"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "md2edrawmind contributors" }]
keywords = ["edrawmind", "mindmap", "markdown", "latex", "docx", "mathjax"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/socoolgzh-max/md2edrawmind"
Source = "https://github.com/socoolgzh-max/md2edrawmind"
Issues = "https://github.com/socoolgzh-max/md2edrawmind/issues"

[project.scripts]
md2edrawmind = "md2edrawmind.cli:main"

[tool.setuptools]
packages = ["md2edrawmind"]
include-package-data = true

[tool.setuptools.package-data]
md2edrawmind = ["web/*", "tools/*"]
